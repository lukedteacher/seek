# for sqlc-gen-zombiezen to generate go code for queries
# erases and exports to internal/dbsql directory

version: '2'

plugins:
  - name: zz
    process:
      cmd: sqlc-gen-zombiezen

sql:
  - engine: sqlite
    schema: ./migrations
    queries: ./queries
    codegen:
      - out: internal/dbsql
        plugin: zz
        options:
          disable_crud: true
          disable_time_conversion: true
