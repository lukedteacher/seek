version: '3'

tasks:
  dev:
    desc: run air, templ, tailwind, and the server in development mode
    deps: [templ, css]
    cmds:
      - task --parallel templ-watch server-watch css-watch

  server-watch:
    desc: runs air (hot-reload and build)
    deps: [templ, css]
    cmds:
      - go tool air -c .air.toml

  build:
    deps: [sqlc, templ, css]
    cmds:
      - go build -o .tmp/bin/main.exe ./cmd/server

  build-linux:
    deps: [sqlc, templ, css]
    cmds:
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags=prod -o bin/main ./cmd/server

  test:
    deps: [sqlc, templ]
    cmds:
      - go test ./...

  vet:
    deps: [sqlc, templ]
    cmds:
      - go vet ./...

  migrate:
    cmds:
      - go run ./cmd/server -migrate-only

  seed:
    cmds:
      - go run ./cmd/server -seed-only

  reset:
    cmds:
      - go run ./cmd/server -reset-read-models

  templ:
    sources:
      - '**/*.templ'
    generates:
      - '**/*_templ.go'
    cmds:
      - go tool templ generate

  templ-watch:
    cmds:
      - go tool templ generate -watch

  sqlc:
    sources:
      - sqlc.yaml
      - queries/**/*.sql
      - migrations/**/*.sql
    generates:
      - internal/dbsql/**/*.go
    cmds:
      - GOBIN="{{.ROOT_DIR}}/.bin" go install github.com/delaneyj/toolbelt/sqlc-gen-zombiezen
      - PATH="{{.ROOT_DIR}}/.bin:$PATH" sqlc generate

  css:
    sources:
      - src/**/*.css
      - src/daisyui/**/*.js
      - internal/**/*.templ
      - internal/**/*.go
      - pkg/**/*.templ
    generates:
      - static/styles/style.css
    cmds:
      - go tool gotailwind -i src/input.css -o static/styles/style.css

  css-watch:
    cmds:
      - go tool gotailwind -i src/input.css -o static/styles/style.css -w
